<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>TaskPoint - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 p-6 max-w-2xl mx-auto space-y-6 pb-20">

  <h1 class="text-2xl font-bold text-slate-800">TaskPoint - অ্যাডমিন প্যানেল</h1>

  <!-- Create New Task -->
  <div class="bg-white p-5 rounded-xl shadow space-y-3">
    <h2 class="font-bold text-lg">নতুন কাজ যোগ করুন</h2>
    <input id="task-title" type="text" placeholder="কাজের শিরোনাম (যেমন: টেলিগ্রাম জয়েন)" class="w-full border p-2 rounded">
    <textarea id="task-desc" placeholder="কাজের বিবরণ" class="w-full border p-2 rounded"></textarea>
    <input id="task-link" type="text" placeholder="সঠিক লিংক (যেমন: https://t.me/...)" class="w-full border p-2 rounded">
    <input id="task-reward" type="number" placeholder="টাকা/রিওয়ার্ড (যেমন: 5)" class="w-full border p-2 rounded">
    <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold w-full cursor-pointer">কাজ পাবলিশ করুন</button>
  </div>

  <!-- Task List -->
  <div class="bg-white p-5 rounded-xl shadow space-y-3">
    <h2 class="font-bold text-lg">চলমান কাজসমূহ</h2>
    <div id="admin-tasks-list" class="space-y-2 text-sm"></div>
  </div>

  <script>
    // আপনার ফায়ারবেস কনফিগারেশন এখানে বসান (উভয় ফাইলে একই কনফিগারেশন হতে হবে)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const desc = document.getElementById('task-desc').value.trim();
      const link = document.getElementById('task-link').value.trim();
      const reward = parseFloat(document.getElementById('task-reward').value);

      if (!title || !link || isNaN(reward)) {
        alert('সকল তথ্য সঠিকভাবে পূরণ করুন');
        return;
      }

      db.collection("tasks").add({
        title: title,
        description: desc,
        link: link,
        reward: reward,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert('সফলভাবে পাবলিশ হয়েছে!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-link').value = '';
        document.getElementById('task-reward').value = '';
        loadAdminTasks();
      });
    }

    function loadAdminTasks() {
      const listDiv = document.getElementById('admin-tasks-list');
      db.collection("tasks").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        let html = '';
        querySnapshot.forEach((doc) => {
          const task = doc.data();
          html += `
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded border">
              <div>
                <p class="font-bold text-slate-800">${task.title}</p>
                <p class="text-xs text-blue-600 truncate max-w-xs">${task.link}</p>
                <p class="text-xs text-emerald-600 font-semibold">Reward: ৳${task.reward}</p>
              </div>
              <button onclick="deleteTask('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-bold cursor-pointer">ডিলিট</button>
            </div>
          `;
        });
        listDiv.innerHTML = html || '<p class="text-slate-400">কোনো কাজ নেই</p>';
      });
    }

    function deleteTask(id) {
      if (confirm('ডিলিট করতে চান?')) {
        db.collection("tasks").doc(id).delete().then(() => loadAdminTasks());
      }
    }

    window.onload = loadAdminTasks;
  </script>
</body>
</html>
