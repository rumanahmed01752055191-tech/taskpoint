<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>TaskPoint - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 p-6 max-w-2xl mx-auto space-y-6 pb-20">

  <h1 class="text-2xl font-bold text-slate-800">TaskPoint - অ্যাডমিন প্যানেল</h1>

  <!-- ১. নতুন কাজ যোগ করুন -->
  <div class="bg-white p-5 rounded-xl shadow space-y-3">
    <h2 class="font-bold text-lg">১. নতুন কাজ যোগ করুন (Task Create)</h2>
    <input id="task-title" type="text" placeholder="কাজের শিরোনাম (যেমন: ফেসবুক পেজ লাইক)" class="w-full border p-2 rounded">
    <textarea id="task-desc" placeholder="কাজের বিবরণ" class="w-full border p-2 rounded"></textarea>
    <input id="task-link" type="text" placeholder="টাস্কের লিংক (যেমন: https://facebook.com/...)" class="w-full border p-2 rounded">
    <input id="task-reward" type="number" placeholder="রিওয়ার্ড বা পুরস্কার (যেমন: 2)" class="w-full border p-2 rounded">
    <button onclick="addTask()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold w-full cursor-pointer">কাজ পাবলিশ করুন</button>
  </div>

  <!-- ২. বর্তমান কাজ ডিলিট বা ম্যানেজ করার অপশন -->
  <div class="bg-white p-5 rounded-xl shadow space-y-3">
    <h2 class="font-bold text-lg">২. বর্তমান একটিভ কাজসমূহ (ডিলিট অপশনসহ)</h2>
    <div id="admin-tasks-list" class="space-y-3 text-sm">
      <p class="text-slate-400">কাজ লোড হচ্ছে...</p>
    </div>
  </div>

  <!-- ৩. অন্যান্য সেকশন -->
  <div class="bg-white p-5 rounded-xl shadow space-y-3">
    <h2 class="font-bold text-lg">৩. ইউজারদের জমার কাজ ও উইথড্র</h2>
    <p class="text-xs text-slate-500">বর্তমানে কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>
  </div>

  <script>
    // আপনার ফায়ারবেস কনফিগারেশন এখানে বসাতে হবে
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // ফায়ারবেস ইনিশিয়ালাইজ
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // কাজ পাবলিশ করার ফাংশন
    function addTask() {
      const title = document.getElementById('task-title').value;
      const desc = document.getElementById('task-desc').value;
      const link = document.getElementById('task-link').value;
      const reward = document.getElementById('task-reward').value;

      if (!title || !reward) {
        alert('দয়া করে কাজের শিরোনাম এবং রিওয়ার্ড পূরণ করুন!');
        return;
      }

      db.collection("tasks").add({
        title: title,
        description: desc,
        link: link,
        reward: Number(reward),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        alert('কাজ সফলভাবে পাবলিশ হয়েছে!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-link').value = '';
        document.getElementById('task-reward').value = '';
        loadTasks();
      })
      .catch((error) => {
        console.error("ত্রুটি ঘটেছে: ", error);
        alert('কাজ পাবলিশ করতে সমস্যা হয়েছে!');
      });
    }

    // কাজগুলো লাইভ দেখানোর এবং ডিলিট করার ফাংশন
    function loadTasks() {
      const listDiv = document.getElementById('admin-tasks-list');
      db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        listDiv.innerHTML = "";
        if (snapshot.empty) {
          listDiv.innerHTML = '<p class="text-slate-400">বর্তমানে কোনো কাজ নেই।</p>';
          return;
        }
        snapshot.forEach((doc) => {
          const task = doc.data();
          const taskElement = document.createElement('div');
          taskElement.className = "flex justify-between items-center border p-3 rounded";
          taskElement.innerHTML = `
            <div>
              <p class="font-bold">${task.title}</p>
              <p class="text-xs text-slate-500">রিওয়ার্ড: ${task.reward} টাকা</p>
            </div>
            <button onclick="deleteTask('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs cursor-pointer">ডিলিট</button>
          `;
          listDiv.appendChild(taskElement);
        });
      });
    }

    // কাজ ডিলিট করার ফাংশন
    function deleteTask(id) {
      if (confirm('আপনি কি এই কাজ borrar করতে চান?')) {
        db.collection("tasks").doc(id).delete().then(() => {
          alert('কাজ সফলভাবে মুছে ফেলা হয়েছে!');
        }).catch((error) => {
          console.error("ডিলিট করতে সমস্যা হয়েছে: ", error);
        });
      }
    }

    // পেজ লোড হওয়ার সাথে সাথে কাজগুলো দেখাবে
    window.onload = loadTasks;
  </script>
</body>
</html>
